[package]
name = "padbridge"
version = "0.1.0"
edition = "2024"

[dependencies]
evdev = { version = "0.13.2", features = ["tokio"] }
futures-util = "0.3.34"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "net", "io-util", "signal", "sync"] }
toml = "1.2.0"
zbus = { version = "5", default-features = false, features = ["tokio"] }
